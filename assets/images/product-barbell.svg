<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A3A5C"/>
      <stop offset="100%" stop-color="#062033"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8E4DC"/>
      <stop offset="50%" stop-color="#A8A49C"/>
      <stop offset="100%" stop-color="#6E6A62"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A5A7A"/>
      <stop offset="100%" stop-color="#0A2F4A"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <g transform="translate(0,20)">
    <rect x="70" y="188" width="260" height="14" rx="3" fill="url(#metal)"/>
    <!-- Left plates -->
    <ellipse cx="90" cy="195" rx="28" ry="70" fill="url(#plate)" stroke="#D4AF37" stroke-width="2"/>
    <ellipse cx="115" cy="195" rx="22" ry="55" fill="#124A6E" stroke="#D4AF37" stroke-width="1.5"/>
    <ellipse cx="135" cy="195" rx="16" ry="40" fill="#0E4A6E" stroke="#C9A227" stroke-width="1"/>
    <!-- Right plates -->
    <ellipse cx="310" cy="195" rx="28" ry="70" fill="url(#plate)" stroke="#D4AF37" stroke-width="2"/>
    <ellipse cx="285" cy="195" rx="22" ry="55" fill="#124A6E" stroke="#D4AF37" stroke-width="1.5"/>
    <ellipse cx="265" cy="195" rx="16" ry="40" fill="#0E4A6E" stroke="#C9A227" stroke-width="1"/>
  </g>
  <text x="200" y="360" text-anchor="middle" fill="#D4AF37" font-family="sans-serif" font-size="14" letter-spacing="3">OLYMPIC</text>
</svg>
